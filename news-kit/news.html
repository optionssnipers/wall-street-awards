<!DOCTYPE html><html><head><meta charset="utf-8"><title>News</title>
<style>
@font-face{font-family:'Playfair Display';font-weight:900;font-style:normal;src:url(fonts/playfair-display-latin-900-normal.woff2)}
@font-face{font-family:'Archivo Black';src:url(fonts/archivo-black-latin-400-normal.woff2)}
@font-face{font-family:'Outfit';font-weight:400;src:url(fonts/outfit-latin-400-normal.woff2)}
@font-face{font-family:'Outfit';font-weight:600;src:url(fonts/outfit-latin-600-normal.woff2)}
@font-face{font-family:'JetBrains Mono';font-weight:700;src:url(fonts/jetbrains-mono-latin-700-normal.woff2)}
:root{--bg:#0A0A0A;--gold:#F5C842;--green:#14D9A0;--red:#E63946;--card:#121212;--line:#2a2a2a}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--bg);width:1080px;height:1350px;overflow:hidden}
body{position:relative;padding:92px 76px 0;color:#fff;
 background:radial-gradient(ellipse 900px 700px at 100% 0%,rgba(60,48,18,.75),transparent 70%),radial-gradient(ellipse 700px 900px at 0% 100%,rgba(28,24,12,.6),transparent 70%),var(--bg)}
.frame{position:absolute;inset:22px;border:1px solid rgba(212,164,55,.28)}
.c{position:absolute;width:46px;height:46px;border:4px solid var(--gold)}
.tl{top:14px;left:14px;border-right:0;border-bottom:0}.tr{top:14px;right:14px;border-left:0;border-bottom:0}
.bl{bottom:14px;left:14px;border-right:0;border-top:0}.br{bottom:14px;right:14px;border-left:0;border-top:0}
.top{display:flex;justify-content:space-between;align-items:center}
.kick{font-family:'JetBrains Mono';font-weight:700;color:var(--gold);font-size:24px;letter-spacing:.18em}
.date{font-family:'JetBrains Mono';font-size:20px;color:#9a9a9a;letter-spacing:.1em}
h1{font-family:'Archivo Black';font-weight:400;font-size:80px;line-height:1.02;margin-top:24px;letter-spacing:-1px}
h1 span{color:var(--gold)}
h1 span.g{color:#14D9A0;font-family:'Playfair Display';font-weight:900;text-shadow:0 0 30px rgba(20,217,160,.35)}
h1 span.rd{color:#E63946;font-family:'Playfair Display';font-weight:900}
.sub{font-family:'Outfit';font-size:32px;line-height:1.25;color:#d8d8d8;margin-top:18px}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:28px}
.tile{background:var(--card);border:2px solid var(--line);padding:22px 10px 18px;text-align:center;border-top:5px solid var(--red)}
.tile .n{font-family:'Archivo Black';font-size:60px;color:#14D9A0;line-height:1}
.tile .n.neg{color:var(--red)}.tile.neg{border-top-color:var(--red)}
.tile.pos{border-top-color:#14D9A0}
.tile .t{font-family:'Archivo Black';font-size:28px;margin-top:10px}
.tile .s{font-family:'JetBrains Mono';font-size:17px;color:#9a9a9a;margin-top:6px;letter-spacing:.08em}
.what{font-family:'Outfit';font-size:28px;line-height:1.32;color:#bdbdbd;margin-top:22px}
.what b{color:#fff;font-weight:600}
.box{margin-top:22px;border:2px solid var(--gold);background:rgba(245,200,66,.06);padding:20px 28px}
.box h3{font-family:'Archivo Black';font-weight:400;font-size:32px;color:var(--gold)}
.box ul{list-style:none;margin-top:10px;display:flex;flex-direction:column;gap:10px}
.box li{font-family:'Outfit';font-size:28px;line-height:1.25;color:#f0f0f0}
.box li b{color:#fff;font-weight:600}
.foot{position:absolute;left:76px;right:76px;bottom:50px;display:flex;justify-content:space-between;align-items:center;font-family:'JetBrains Mono';font-size:19px;letter-spacing:.12em}
.foot b{color:var(--gold)}.foot span{color:#9a9a9a}
.disc{position:absolute;left:76px;right:76px;bottom:88px;font-family:'JetBrains Mono';font-size:16px;color:#6f6f6f}
</style></head><body>
<div class="frame"></div><div class="c tl"></div><div class="c tr"></div><div class="c bl"></div><div class="c br"></div>
<div class="top"><div class="kick" id="kick"></div><div class="date" id="date"></div></div>
<h1 id="h"></h1><div class="sub" id="sub"></div>
<div class="row" id="row"></div>
<div class="what" id="what"></div>
<div class="box"><h3 id="bh"></h3><ul id="bl"></ul></div>
<div class="disc">Educational content only. Not financial advice. Earnings reported Tue Oct 13, 2026.</div>
<div class="foot"><b>OPTIONS SNIPERS UNIVERSITY</b><span>@optionssnipersuniversity</span></div>
<script>
const N={
 kick:"NEWS THAT HITS YOUR WALLET", date:"WED OCT 14, 2026",
 h:'GOLDMAN JUST MADE <span class="g">$5.3 BILLION</span> IN 3 MONTHS',
 sub:"Big bank earnings show how money is moving. Here is what it means for you.",
 tiles:[["PROFIT","GS","+29%"],["REVENUE","GS","+23%"],["EQUITIES","GS","+72%"]],
 what:"<b>What happened:</b> Goldman Sachs reported Q3 earnings of $17.01 a share on $18.68 billion in revenue, well above estimates. Stock trading led the jump. Inflation (CPI) data lands today at 8:30 AM ET.",
 bh:"WHAT IT MEANS FOR YOU",
 bl:["<b>Your portfolio:</b> big banks sit inside most index funds. One strong report can move more than one account.","<b>Your wallet:</b> a hot CPI reading could revive rate-hike talk, which can lift loan and card rates. Nothing changes today.","<b>Your edge:</b> an earnings gap is not a signal alone. Watch volume and the first 30 minutes."]
};
kick.textContent=N.kick;date.textContent=N.date;h.innerHTML=N.h;sub.textContent=N.sub;what.innerHTML=N.what;bh.textContent=N.bh;
row.innerHTML=N.tiles.map(t=>{const neg=String(t[2]).trim().startsWith('-');return `<div class="tile ${neg?'neg':'pos'}"><div class="n ${neg?'neg':''}">${t[2]}</div><div class="t">${t[0]}</div><div class="s">${t[1]}</div></div>`}).join('');
bl.innerHTML=N.bl.map(x=>`<li>${x}</li>`).join('');
</script></body></html>
