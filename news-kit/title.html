<!DOCTYPE html><html><head><meta charset="utf-8"><title>Title</title>
<style>
@font-face{font-family:'Archivo Black';src:url(fonts/archivo-black-latin-400-normal.woff2)}
@font-face{font-family:'Outfit';font-weight:400;src:url(fonts/outfit-latin-400-normal.woff2)}
@font-face{font-family:'Outfit';font-weight:600;src:url(fonts/outfit-latin-600-normal.woff2)}
@font-face{font-family:'JetBrains Mono';font-weight:700;src:url(fonts/jetbrains-mono-latin-700-normal.woff2)}
:root{--bg:#0A0A0A;--gold:#F5C842;--red:#FF1F2D}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--bg);width:1080px;height:1350px;overflow:hidden}
body{position:relative;padding:70px 76px 0;color:#fff;
 background:radial-gradient(ellipse 900px 700px at 50% 38%,rgba(255,31,45,.20),transparent 70%),radial-gradient(ellipse 900px 700px at 100% 0%,rgba(60,48,18,.7),transparent 70%),radial-gradient(ellipse 700px 900px at 0% 100%,rgba(28,24,12,.6),transparent 70%),var(--bg)}
.frame{position:absolute;inset:22px;border:1px solid rgba(212,164,55,.28)}
.c{position:absolute;width:46px;height:46px;border:4px solid var(--gold)}
.tl{top:14px;left:14px;border-right:0;border-bottom:0}.tr{top:14px;right:14px;border-left:0;border-bottom:0}
.bl{bottom:14px;left:14px;border-right:0;border-top:0}.br{bottom:14px;right:14px;border-left:0;border-top:0}
.top{display:flex;justify-content:space-between;align-items:center}
.date{font-family:'JetBrains Mono';font-weight:700;font-size:20px;color:#9a9a9a;letter-spacing:.1em}
.shield{width:84px}
.brk{margin-top:28px;display:flex;align-items:center;gap:22px;background:var(--red);padding:20px 34px;width:max-content;box-shadow:0 0 50px rgba(255,31,45,.45)}
.dot{width:26px;height:26px;border-radius:50%;background:#fff}
.brk span{font-family:'Archivo Black';font-size:50px;letter-spacing:.06em;line-height:1}
h1{font-family:'Archivo Black';font-weight:400;font-size:108px;line-height:1;color:var(--red);margin-top:40px;letter-spacing:-2px;text-transform:uppercase;text-shadow:0 0 40px rgba(255,31,45,.35)}
.sub{font-family:'Outfit';font-weight:600;font-size:38px;line-height:1.25;color:#fff;margin-top:34px}
.sub b{color:var(--gold)}
.swipe{position:absolute;left:76px;right:76px;bottom:104px;font-family:'JetBrains Mono';font-weight:700;font-size:24px;letter-spacing:.2em;color:var(--gold);text-align:right}
.foot{position:absolute;left:76px;right:76px;bottom:50px;display:flex;justify-content:space-between;font-family:'JetBrains Mono';font-weight:700;font-size:19px;letter-spacing:.12em}
.foot b{color:var(--gold)}.foot span{color:#9a9a9a}
</style></head><body>
<div class="frame"></div><div class="c tl"></div><div class="c tr"></div><div class="c bl"></div><div class="c br"></div>
<div class="top"><div class="date" id="date"></div><img class="shield" src="logos/OSU.png" alt=""></div>
<div class="brk"><div class="dot"></div><span>BREAKING NEWS</span></div>
<h1 id="h"></h1>
<div class="sub" id="sub"></div>
<div class="swipe">SWIPE FOR THE FACTS &rarr;</div>
<div class="foot"><b>OPTIONS SNIPERS UNIVERSITY</b><span>@optionssnipersuniversity</span></div>
<script>
/* DAILY EDIT BLOCK for the title slide. Keep h to about 8-10 words max (122px font). Must be true and match the sources. */
const T={
 date:"MON OCT 12, 2026",
 h:"TRUMP SAYS THE TRUCE IS ON. RUSSIA HASN'T CONFIRMED.",
 sub:"Oil is still above <b>$100</b>. Here is what it could mean for your gas and diesel bill."
};
date.textContent=T.date;h.textContent=T.h;sub.innerHTML=T.sub;
</script></body></html>
