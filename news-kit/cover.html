<!DOCTYPE html><html><head><meta charset="utf-8"><title>Cover</title>
<style>
@font-face{font-family:'Archivo Black';src:url(fonts/archivo-black-latin-400-normal.woff2)}
@font-face{font-family:'Anton';src:url(fonts/anton-latin-400-normal.woff2)}
@font-face{font-family:'Inter';font-weight:900;src:url(fonts/inter-latin-900-normal.woff2)}
@font-face{font-family:'Outfit';font-weight:600;src:url(fonts/outfit-latin-600-normal.woff2)}
@font-face{font-family:'JetBrains Mono';font-weight:700;src:url(fonts/jetbrains-mono-latin-700-normal.woff2)}
:root{--bg:#07070a;--gold:#F5C842;--red:#FF1F2D}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--bg);width:1080px;height:1350px;overflow:hidden}
body{position:relative;color:#fff}
#bg{position:absolute;inset:0;width:1080px;height:1350px}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,7,10,.78) 0%,rgba(7,7,10,.15) 30%,rgba(7,7,10,.35) 55%,rgba(7,7,10,.94) 100%)}
.stripes{position:absolute;left:0;right:0;top:0;height:16px;background:repeating-linear-gradient(-45deg,var(--red) 0 22px,#0A0A0A 22px 44px);z-index:5}
.stripes.b{top:auto;bottom:0}
.frame{position:absolute;inset:30px;border:1px solid rgba(212,164,55,.35);z-index:4}
.c{position:absolute;width:46px;height:46px;border:4px solid var(--gold);z-index:5}
.tl{top:24px;left:24px;border-right:0;border-bottom:0}.tr{top:24px;right:24px;border-left:0;border-bottom:0}
.bl{bottom:24px;left:24px;border-right:0;border-top:0}.br{bottom:24px;right:24px;border-left:0;border-top:0}
.top{position:absolute;left:70px;right:70px;top:62px;display:flex;justify-content:space-between;align-items:center;z-index:6}
.date{font-family:'JetBrains Mono';font-weight:700;font-size:21px;color:#d0d0d0;letter-spacing:.1em}
.shield{width:84px}
.brk{display:flex;align-items:stretch;box-shadow:0 0 50px rgba(255,31,45,.55)}
.brk .live{background:#fff;color:var(--red);font-family:'Archivo Black';font-size:26px;padding:10px 16px;display:flex;align-items:center;gap:10px}
.brk .live i{width:16px;height:16px;border-radius:50%;background:var(--red);display:block;box-shadow:0 0 0 5px rgba(255,31,45,.3)}
.brk .t{background:var(--red);font-family:'Archivo Black';font-size:34px;letter-spacing:.05em;padding:8px 22px;line-height:1.2}
.logoWrap{position:absolute;left:0;right:0;top:170px;display:flex;flex-direction:column;align-items:center;z-index:6}
.badge{width:330px;height:330px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#1b2a4a 0%,#0b1226 70%);border:6px solid var(--gold);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 14px rgba(245,200,66,.12),0 0 90px rgba(245,200,66,.55),0 30px 60px rgba(0,0,0,.6)}
.badge svg{width:200px;height:200px;fill:#fff;filter:drop-shadow(0 0 18px rgba(255,255,255,.35))}
.chip{margin-top:26px;font-family:'JetBrains Mono';font-weight:700;font-size:27px;letter-spacing:.2em;color:#0A0A0A;background:var(--gold);padding:10px 22px;box-shadow:0 0 36px rgba(245,200,66,.45)}
.hl{position:absolute;left:70px;right:70px;top:640px;z-index:6}
.s{font-family:'Anton';font-size:96px;line-height:1.02;color:#fff;text-transform:uppercase;letter-spacing:1px;text-shadow:0 6px 0 rgba(0,0,0,.55),0 0 40px rgba(0,0,0,.6)}
.s.r{color:var(--red);text-shadow:0 0 36px rgba(255,31,45,.5),0 6px 0 rgba(0,0,0,.55)}
.s em{font-family:'Inter';font-style:normal;font-weight:900;color:#fff;text-transform:uppercase;letter-spacing:0;font-size:.94em;padding:0 .08em;background:linear-gradient(transparent 62%,rgba(245,200,66,.92) 62% 90%,transparent 90%);text-shadow:0 4px 0 rgba(0,0,0,.45)}
.s em.g{color:#14D9A0;background:none;text-shadow:0 0 34px rgba(20,217,160,.55),0 5px 0 rgba(0,0,0,.6)}
.s em.rd{color:#E63946;background:none;text-shadow:0 0 34px rgba(230,57,70,.5),0 5px 0 rgba(0,0,0,.6)}
.sub{position:absolute;left:70px;right:70px;top:1040px;font-family:'Outfit';font-weight:600;font-size:37px;line-height:1.25;color:#fff;z-index:6;text-shadow:0 2px 14px rgba(0,0,0,.8)}
.sub b{color:#14D9A0}
.swipe{position:absolute;left:70px;bottom:92px;background:var(--gold);color:#0A0A0A;font-family:'Archivo Black';font-size:28px;letter-spacing:.08em;padding:16px 28px;z-index:6;box-shadow:0 0 36px rgba(245,200,66,.4)}
.foot{position:absolute;left:70px;right:70px;bottom:42px;display:flex;justify-content:space-between;font-family:'JetBrains Mono';font-weight:700;font-size:17px;letter-spacing:.12em;z-index:6}
.foot b{color:var(--gold)}.foot span{color:#b5b5b5}
</style></head><body>
<svg id="bg" viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg"></svg>
<div class="shade"></div>
<div class="stripes"></div><div class="stripes b"></div>
<div class="frame"></div><div class="c tl"></div><div class="c tr"></div><div class="c bl"></div><div class="c br"></div>
<div class="top"><div class="brk"><div class="live"><i></i>LIVE</div><div class="t">BREAKING NEWS</div></div><div class="date" id="date"></div></div>
<div class="logoWrap"><div class="badge" id="badge"></div><div class="chip" id="chip"></div></div>
<div class="hl" id="hl"></div>
<div class="sub" id="sub"></div>
<div class="swipe">&rarr; SWIPE</div>
<div class="foot"><b>OPTIONS SNIPERS UNIVERSITY</b><span>@optionssnipersuniversity</span></div>
<script>
/* DAILY EDIT BLOCK for the COVER slide.
   logo: inline <svg> path markup of the company logo (white fill); chip: ticker line.
   lines: 2 SENTENCES, ALL CAPS, each on its own line. *asterisks* = bold white serif + gold highlight; +plus+ = bold green serif (positive numbers/words); ~tildes~ = bold red serif (negative). Prefix a line with ! to make it red.
   sub: one line, key number in <b>. Everything must be true to the sources. */
const C={
 date:"THU OCT 15, 2026",
 chip:"NVIDIA  |  NASDAQ: NVDA",
 logo:"<svg role=\"img\" viewBox=\"0 0 24 24\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M8.948 8.798v-1.43a6.7 6.7 0 0 1 .424-.018c3.922-.124 6.493 3.374 6.493 3.374s-2.774 3.851-5.75 3.851c-.398 0-.787-.062-1.158-.185v-4.346c1.528.185 1.837.857 2.747 2.385l2.04-1.714s-1.492-1.952-4-1.952a6.016 6.016 0 0 0-.796.035m0-4.735v2.138l.424-.027c5.45-.185 9.01 4.47 9.01 4.47s-4.08 4.964-8.33 4.964c-.37 0-.733-.035-1.095-.097v1.325c.3.035.61.062.91.062 3.957 0 6.82-2.023 9.593-4.408.459.371 2.34 1.263 2.73 1.652-2.633 2.208-8.772 3.984-12.253 3.984-.335 0-.653-.018-.971-.053v1.864H24V4.063zm0 10.326v1.131c-3.657-.654-4.673-4.46-4.673-4.46s1.758-1.944 4.673-2.262v1.237H8.94c-1.528-.186-2.73 1.245-2.73 1.245s.68 2.412 2.739 3.11M2.456 10.9s2.164-3.197 6.5-3.533V6.201C4.153 6.59 0 10.653 0 10.653s2.35 6.802 8.948 7.42v-1.237c-4.84-.6-6.492-5.936-6.492-5.936z\"/></svg>",
 lines:["AI STOCKS *CRACKED*.", "NASDAQ ~-1.9%~ IN A DAY."],
 sub:"S&P 500 <b style=\"color:#E63946\">-1.1%</b>, its worst day since July, as a hot inflation report hit tech. Here is what it could mean for your money."
};
date.textContent=C.date;chip.textContent=C.chip;badge.innerHTML=C.logo;
hl.innerHTML=C.lines.map(l=>{const r=l[0]==='!';if(r)l=l.slice(1);return '<div class="s'+(r?' r':'')+'">'+l.replace(/\*(.+?)\*/g,'<em>$1</em>').replace(/\+(.+?)\+/g,'<em class="g">$1</em>').replace(/~(.+?)~/g,'<em class="rd">$1</em>')+'</div>'}).join('');
sub.innerHTML=C.sub;
/* ---- skyline "photo" background: seeded, night financial district with gold dawn glow ---- */
(function(){const svg=document.getElementById('bg');let seed=20261014;const R=()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
let h=`<defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#05060d"/><stop offset=".45" stop-color="#0d1530"/><stop offset=".78" stop-color="#3a2a1c"/><stop offset="1" stop-color="#b9862b"/></linearGradient>
<radialGradient id="glow" cx=".5" cy="1" r=".7"><stop offset="0" stop-color="#ffd978" stop-opacity=".95"/><stop offset=".4" stop-color="#f5c842" stop-opacity=".35"/><stop offset="1" stop-color="#f5c842" stop-opacity="0"/></radialGradient>
<linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".85"/></linearGradient></defs>
<rect width="1080" height="1350" fill="url(#sky)"/><rect width="1080" height="1350" fill="url(#glow)"/>`;
for(let i=0;i<90;i++){h+=`<circle cx="${R()*1080}" cy="${R()*600}" r="${R()*1.6+.3}" fill="#fff" opacity="${R()*.6+.2}"/>`}
function layer(base,minW,maxW,minH,maxH,col,win,op){let x=-20;let s='';while(x<1100){const w=minW+R()*(maxW-minW),hh=minH+R()*(maxH-minH);s+=`<rect x="${x}" y="${base-hh}" width="${w}" height="${hh+200}" fill="${col}" opacity="${op}"/>`;
 if(R()<.35){s+=`<rect x="${x+w*.4}" y="${base-hh-60}" width="${w*.2}" height="62" fill="${col}" opacity="${op}"/>`}
 if(win){for(let wy=base-hh+14;wy<base-8;wy+=15){for(let wx=x+8;wx<x+w-10;wx+=13){if(R()<.30){s+=`<rect x="${wx}" y="${wy}" width="6" height="8" fill="${R()<.8?'#ffd36b':'#fff3c9'}" opacity="${R()*.7+.25}"/>`}}}}
 x+=w+R()*6}return s}
h+=layer(1010,60,120,230,520,'#141a33',false,.55);
h+=layer(1090,70,130,300,700,'#0b0f22',true,.96);
h+=layer(1190,90,160,260,640,'#05060c',true,1);
/* candlestick overlay */
let cx=60,cy=1000,cs='';for(let i=0;i<22;i++){const up=R()<.62;const body=18+R()*60;const wick=body+20+R()*40;const col=up?'#14D9A0':'#E63946';cy+= (up?-1:1)*(R()*22)-6;cy=Math.max(740,Math.min(1060,cy));cs+=`<line x1="${cx}" y1="${cy-wick/2}" x2="${cx}" y2="${cy+wick/2}" stroke="${col}" stroke-width="3" opacity=".55"/><rect x="${cx-9}" y="${cy-body/2}" width="18" height="${body}" fill="${col}" opacity=".55"/>`;cx+=46}
h+=cs;
h+=`<rect y="1000" width="1080" height="350" fill="url(#fade)"/>`;
svg.innerHTML=h})();
</script></body></html>
