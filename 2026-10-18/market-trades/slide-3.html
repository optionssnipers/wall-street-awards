<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:'Anton';src:url('../../news-kit/anton-latin-400-normal.woff2') format('woff2');}
@font-face{font-family:'PF';src:url('../../news-kit/playfair-display-latin-900-italic.woff2') format('woff2');font-style:italic;}
@font-face{font-family:'Inter';src:url('../../news-kit/inter-latin-900-normal.woff2') format('woff2');font-weight:900;}
*{box-sizing:border-box}
body{margin:0;width:1080px;height:1350px;background:#0A0A0A;color:#fff;font-family:Inter,sans-serif;position:relative;overflow:hidden}
.frame{position:absolute;inset:36px;border:2px solid #D4A437}
.wrap{position:absolute;inset:110px;display:flex;flex-direction:column}
.label{color:#D4A437;font-size:26px;letter-spacing:.18em;font-weight:900}
h1{font-family:Anton,sans-serif;font-size:132px;line-height:.95;letter-spacing:-.025em;margin:40px 0 50px;text-transform:uppercase;font-weight:400}
em{font-family:PF,serif;font-style:italic;color:#F5C842;text-transform:none}
p{font-size:40px;line-height:1.35;margin:0 0 30px;color:#e8e8e8}
.logo{position:absolute;top:80px;right:90px;width:110px}
.swipe{position:absolute;bottom:90px;right:110px;color:#D4A437;font-size:30px;letter-spacing:.15em;font-weight:900}
</style></head><body>
<div class="frame"></div>
<img class="logo" src="../../logos/OSU.png">
<div class="wrap">
  <div class="label">SIGNIFICANCE</div>
  <h1>Why it <em>matters.</em></h1>
  <p>Insider buying is worth watching. It is not proof of a plan.</p>
  <p>This stock trades around a dime. A CEO buying there is a weak signal.</p>
  <p>Check the company's fundamentals and float before drawing a conclusion.</p>
</div>
<div class="swipe">→ SWIPE</div>
</body></html>
